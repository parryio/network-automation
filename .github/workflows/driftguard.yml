name: DriftGuard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:

jobs:
  driftguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run DriftGuard sample
        run: |
          python -m scripts.driftguard \
            --inventory inventory.yml \
            --configs configs \
            --rules rules \
            --out out/drift \
            --render-remediation \
            --fail-on critical \
            --offline
      - name: Upload DriftGuard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-artifacts
          path: |
            out/drift/drift_report.md
            out/drift/drift_report.json
            out/drift/metrics.json
            out/drift/diffs/
            out/drift/remediation/
            out/drift/plan.md
            out/drift/plan.json
